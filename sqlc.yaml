version: "2"
sql:
  - schema: "internal/db/schema"
    queries: "internal/db/queries"
    engine: "postgresql"
    gen:
      go:
        package: "store"
        out: "internal/store"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_empty_slices: true
        sql_package: "pgx/v5"
